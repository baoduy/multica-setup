# Catch values the live sync would reject and bundle files that disagree with each other
# (rules L1-L10 in scripts/drunk-live-sync.py lint) before they reach main. Offline.
name: drunk bundle lint

on:
  pull_request:
    paths: ['export/drunk-workspace/**', 'scripts/drunk-live-sync.py', 'scripts/test_drunk_lint.py']
  push:
    branches: [dev]
    paths: ['export/drunk-workspace/**', 'scripts/drunk-live-sync.py', 'scripts/test_drunk_lint.py']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_drunk_lint.py
      - run: python3 scripts/drunk-live-sync.py --lint
